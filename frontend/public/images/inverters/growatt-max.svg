<svg xmlns="http://www.w3.org/2000/svg" viewBox="240 400 1130 770" width="1130" height="770" role="img" aria-label="Growatt MAX string inverter (illustration)">
  <title>Growatt MAX string inverter (illustration, not to scale)</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfb"/>
      <stop offset="0.55" stop-color="#f3f3f3"/>
      <stop offset="1" stop-color="#e9e9e9"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e2e2"/>
      <stop offset="0.35" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#ececec"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#474747"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.32" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="0.28" stop-color="#9a9a9a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- mounting feet -->
  <g fill="#262626">
    <path d="M276 1080 h70 l-6 24 l-24 26 h14 l-4 14 h-58 a8 8 0 0 1 -8 -8 v-48 a8 8 0 0 1 8 -8 z"/>
    <path d="M1232 1080 h-70 l6 24 l24 26 h-14 l4 14 h58 a8 8 0 0 0 8 -8 v-48 a8 8 0 0 0 -8 -8 z"/>
  </g>
  <g fill="#3c3c3c">
    <path d="M292 1096 l40 -6 l-30 36 z"/>
    <path d="M1216 1096 l-40 -6 l30 36 z"/>
  </g>

  <!-- DC connectors and glands along the bottom -->
  <g fill="#1f1f1f">
    <g id="pv3">
      <rect x="370" y="1086" width="16" height="30" rx="3"/>
      <rect x="398" y="1086" width="16" height="30" rx="3"/>
      <rect x="426" y="1086" width="16" height="30" rx="3"/>
      <rect x="366" y="1084" width="96" height="8" rx="2"/>
    </g>
    <use href="#pv3" x="203"/>
    <g>
      <rect x="776" y="1086" width="16" height="30" rx="3"/>
      <rect x="804" y="1086" width="16" height="30" rx="3"/>
      <rect x="832" y="1086" width="16" height="30" rx="3"/>
      <rect x="860" y="1086" width="16" height="30" rx="3"/>
      <rect x="772" y="1084" width="108" height="8" rx="2"/>
    </g>
    <path d="M506 1086 h40 l-4 12 h-32 z"/>
    <path d="M700 1086 h40 l-4 12 h-32 z"/>
    <path d="M914 1086 h40 l-4 12 h-32 z"/>
    <rect x="1032" y="1086" width="26" height="12" rx="3"/>
    <rect x="1041" y="1096" width="8" height="8" rx="2"/>
  </g>

  <!-- side wiring box -->
  <rect x="1236" y="468" width="114" height="518" rx="6" fill="url(#side)" stroke="#d6d6d6" stroke-width="2"/>
  <line x1="1320" y1="472" x2="1320" y2="982" stroke="#cfcfcf" stroke-width="3"/>

  <!-- main body -->
  <rect x="262" y="420" width="982" height="666" rx="30" fill="url(#body)" stroke="#dcdcdc" stroke-width="2" filter="url(#shadow)"/>

  <!-- screws -->
  <g fill="#e6e6e6" stroke="#b9b9b9" stroke-width="2">
    <circle cx="318" cy="436" r="7"/>
    <circle cx="753" cy="436" r="7"/>
    <circle cx="1185" cy="436" r="7"/>
    <circle cx="280" cy="751" r="7"/>
    <circle cx="1224" cy="751" r="7"/>
    <circle cx="318" cy="1068" r="7"/>
    <circle cx="753" cy="1068" r="7"/>
    <circle cx="1185" cy="1068" r="7"/>
  </g>

  <!-- front panel -->
  <rect x="338" y="494" width="828" height="191" rx="95.5" fill="url(#panel)" filter="url(#shadow)"/>
  <text x="424" y="597" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" letter-spacing="3" fill="#ffffff">GROWATT</text>

  <!-- round display with the green power gauge -->
  <circle cx="1070" cy="592" r="78" fill="url(#glass)"/>
  <circle cx="1070" cy="592" r="78" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  <g fill="none" stroke="#c8f230" stroke-width="7" stroke-linecap="round">
    <path d="M1023 614 A50 50 0 0 1 1018 586"/>
    <path d="M1020 572 A50 50 0 0 1 1030 556"/>
    <path d="M1040 547 A50 50 0 0 1 1058 540"/>
    <path d="M1074 540 A50 50 0 0 1 1092 545"/>
    <path d="M1105 553 A50 50 0 0 1 1116 568"/>
    <path d="M1121 584 A50 50 0 0 1 1117 612"/>
  </g>
  <path d="M1062 600 c2 -14 10 -22 22 -24 c0 12 -6 22 -22 24 z M1062 600 l-6 6" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round"/>
  <text x="1070" y="614" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#c8f230">MAX</text>
  <g fill="none" stroke="#c8f230" stroke-width="2" stroke-linecap="round">
    <path d="M1032 630 h14 M1032 634 h4 M1039 634 h4"/>
    <path d="M1055 632 q4 -6 8 0 t8 0"/>
    <path d="M1097 626 a7 7 0 0 0 0 10 M1112 626 a7 7 0 0 1 0 10"/>
    <circle cx="1104.5" cy="631" r="1.5" fill="#c8f230"/>
  </g>
  <path d="M1083 626 l5 9 h-10 z" fill="none" stroke="#e8e8e8" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
