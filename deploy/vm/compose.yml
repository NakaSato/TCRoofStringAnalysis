# Runs on the VM tcroof-db (/opt/tcroof): Postgres + the single Growatt worker + Redis.
# The API runs on Cloud Run and reaches Postgres (5432) and Redis (6379) over the VPC (VM
# internal IP). Both ports are only open to the internal VPC range (GCP firewall), never the
# internet, and both need a password.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: tc_roof_solar
    # Memory settings come from .env, sized by deploy/gcp.sh for the VM's machine type
    # (defaults: an e2-micro, 1 GB RAM shared with the worker).
    command: >
      postgres -c shared_buffers=${PG_SHARED_BUFFERS:-128MB} -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-384MB}
               -c work_mem=${PG_WORK_MEM:-4MB} -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
               -c max_connections=${PG_MAX_CONNECTIONS:-60} -c random_page_cost=1.1
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar -d tc_roof_solar"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Mirror of the API's live memory cache (backend/app/services/live_store.py), so a Cloud Run
  # cold start or deploy finds it warm. No persistence (--save "", --appendonly no): a restart
  # empties it, and every key expires. Never a store of record.
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru"]
    mem_limit: 384m
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Keep exactly one replica (see app/worker.py).
  growatt-worker:
    image: ${BACKEND_IMAGE:?set in .env}
    command: ["python", "-m", "app.worker"]
    env_file: .env
    volumes:
      - ./secrets:/app/secrets:ro
      - summaries:/data/firestore_export
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  summaries:
