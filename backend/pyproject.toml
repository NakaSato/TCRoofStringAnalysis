[project]
name = "tc-roof-solar-backend"
version = "1.0.0"
description = "FastAPI Backend & Solar Core Engine for TC Roof Solar PV O&M Engineering Suite"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.4",
    "firebase-admin>=7.8.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pytest>=9.2.0",
    "python-multipart>=0.0.33",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.8",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
