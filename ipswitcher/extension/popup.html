<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IP Switcher</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header class="bar">
    <h1 data-s="appName">IP Switcher</h1>
    <div class="row gap">
      <button id="langToggle" class="lang" type="button" data-s="langToggle" data-s-title="langToggleTitle" data-s-aria="langToggleTitle"></button>
      <button id="openWindow" class="icon" type="button" data-s-title="openWindow" data-s-aria="openWindow">⧉</button>
      <button id="openOptions" class="icon" type="button" data-s-title="settings" data-s-aria="settings">⚙</button>
    </div>
  </header>

  <div id="banners"></div>
  <div id="pending"></div>
  <div id="result"></div>
  <div id="current"></div>

  <section id="adaptersSec">
    <div class="sec-head">
      <h2 data-s="adapters">Adapters</h2>
      <label class="small"><input type="checkbox" id="showAll"> <span data-s="showVirtual">Show virtual adapters</span></label>
    </div>
    <div id="adapters" class="list" role="radiogroup"></div>
  </section>

  <section id="profilesSec">
    <div class="sec-head">
      <h2 data-s="profiles">Profiles</h2>
      <span id="profileCount" class="small muted"></span>
    </div>
    <input id="profileSearch" type="search" class="search" autocomplete="off" spellcheck="false"
      data-s-placeholder="searchProfiles" data-s-aria="searchProfiles">
    <div id="profiles" class="list scroll"></div>
    <div id="confirm"></div>
  </section>

  <section id="pingSec">
    <div class="sec-head">
      <h2 data-s="pingConsole">Ping</h2>
      <span id="pingStats" class="small muted"></span>
    </div>
    <form id="pingForm" class="row gap" novalidate>
      <input id="pingHost" class="grow mono" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="10.100.35.254" data-s-aria="pingConsole">
      <button id="pingGo" type="submit" class="primary" data-s="pingStart">Start</button>
    </form>
    <div id="pingChips" class="chips"></div>
    <div id="pingLog" class="console" role="log" hidden></div>
  </section>
</body>
</html>
