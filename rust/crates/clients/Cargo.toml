[package]
name = "tcroof-clients"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "External HTTP APIs ported from backend/solar_core: Growatt OpenAPI, Google Weather, Longdo, RainViewer"

[dependencies]
chrono.workspace = true
jsonwebtoken.workspace = true  # google_auth: RS256 service-account assertion
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[dev-dependencies]
jsonwebtoken.workspace = true
# Correctly rounded float parsing, as Python's json, so the fixtures' floats are read exactly.
serde_json = { workspace = true, features = ["float_roundtrip"] }
tokio.workspace = true
