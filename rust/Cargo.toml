# Rust port of the TC Roof Solar backend (docs/plans/rust-port-master-plan.md).
# Python in backend/ stays the deployed system and the behavioural oracle; nothing here replaces it
# until a part has passed the parity harness (tests/parity) and been cut over.
# Crates are added when their phase starts: db, api (Phase 0 / 1), solar-core (pure engine), clients (external HTTP APIs), services (Phase 3+ domain services).
[workspace]
resolver = "2"
members = ["crates/db", "crates/api", "crates/solar-core", "crates/clients", "crates/services", "crates/worker"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dotenvy = "0.15"
hex = "0.4"
jsonwebtoken = "9"
redis = { version = "0.27", default-features = false, features = ["aio", "tokio-comp"] }  # live cache mirror (services/live_store)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }  # read floats exactly as Python does
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
